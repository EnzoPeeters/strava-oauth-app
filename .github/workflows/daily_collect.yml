name: Daily Strava collection

on:
  schedule:
    # Runs at 03:00 UTC every day. Adjust the cron expression if you
    # want a different time (fields are: minute hour day month weekday).
    - cron: "0 3 * * *"
  workflow_dispatch: {}  # lets you also trigger it manually from the GitHub UI

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests psycopg2-binary

      - name: Run collector
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python collect_weekly_progress.py

      - name: Commit output files back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Daily data collection $(date -u +%Y-%m-%d)"
          git push
